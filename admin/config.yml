backend:
  name: github
  repo: F1roz/drshaiful
  branch: main
  base_url: https://drshaifulislam.vercel.app/
  auth_endpoint: api/auth

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: "home"
    label: "Homepage"
    files:
      - name: "home"
        label: "Homepage Content"
        file: "content/home.json"
        fields:
          - { name: "hero_eyebrow", label: "Hero Eyebrow Text", widget: "string" }
          - { name: "hero_title", label: "Hero Title (Name)", widget: "string" }
          - { name: "hero_subtitle", label: "Hero Subtitle", widget: "text" }
          - name: "stats"
            label: "Stat Counters"
            widget: "list"
            fields:
              - { name: "number", label: "Number", widget: "string" }
              - { name: "label", label: "Label", widget: "string" }
          - { name: "about_heading", label: "About Section Heading", widget: "string" }
          - name: "about_paragraphs"
            label: "About Paragraphs"
            widget: "list"
            field: { name: "paragraph", label: "Paragraph", widget: "text" }
          - { name: "about_quote", label: "Quote", widget: "text" }
          - { name: "position_title", label: "Present Position Title", widget: "string" }
          - { name: "position_subtitle", label: "Present Position Institution", widget: "string" }
          - { name: "profile_image", label: "Profile Photo", widget: "image" }

  - name: "about"
    label: "About Page"
    files:
      - name: "about"
        label: "About Page Content"
        file: "content/about.json"
        fields:
          - { name: "heading", label: "Heading", widget: "string" }
          - name: "paragraphs"
            label: "Bio Paragraphs"
            widget: "list"
            field: { name: "paragraph", label: "Paragraph", widget: "text" }
          - { name: "quote", label: "Quote", widget: "text" }
          - name: "specialty_pills"
            label: "Specialty Tags"
            widget: "list"
            field: { name: "tag", label: "Tag", widget: "string" }
          - { name: "profile_image", label: "Profile Photo", widget: "image" }

  - name: "procedures"
    label: "Expertise / Procedures"
    folder: "content/procedures"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Procedure Title", widget: "string" }
      - name: "catid"
        label: "Category"
        widget: "select"
        options:
          - { label: "General Paediatric Surgery", value: "general" }
          - { label: "Neonatal Surgery", value: "neonatal" }
          - { label: "Minimal Access Surgery", value: "mas" }
          - { label: "Paediatric Urology", value: "urology" }
          - { label: "Paediatric Hepatobiliary Surgery", value: "hepatobiliary" }
          - { label: "Paediatric Surgical Oncology", value: "oncology" }
      - { name: "category", label: "Category Display Name", widget: "string" }
      - { name: "summary", label: "Short Summary (used on cards & SEO)", widget: "text" }
      - { name: "image", label: "Featured Image", widget: "image" }
      - { name: "overview", label: "Overview", widget: "text" }
      - { name: "procedure_text", label: "The Procedure", widget: "text" }
      - { name: "prep", label: "Preparing for Surgery", widget: "text" }
      - { name: "recovery", label: "Recovery", widget: "text" }
      - { name: "complications", label: "Possible Complications", widget: "text" }
      - { name: "followup", label: "Follow-up", widget: "text" }
      - { name: "order", label: "Display Order", widget: "number", default: 0 }

  - name: "qualifications"
    label: "Qualifications"
    files:
      - name: "qualifications"
        label: "Qualifications List"
        file: "content/qualifications.json"
        fields:
          - name: "qualifications"
            label: "Qualifications"
            widget: "list"
            fields:
              - { name: "period", label: "Degree / Period", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "description", label: "Description", widget: "text" }

  - name: "career"
    label: "Career History"
    files:
      - name: "career"
        label: "Career Timeline"
        file: "content/career.json"
        fields:
          - name: "career"
            label: "Career Entries"
            widget: "list"
            fields:
              - { name: "period", label: "Period", widget: "string" }
              - { name: "title", label: "Title / Role", widget: "string" }
              - { name: "description", label: "Description", widget: "text" }

  - name: "research"
    label: "Research & Publications"
    files:
      - name: "research"
        label: "Publications List"
        file: "content/research.json"
        fields:
          - name: "research"
            label: "Publications"
            widget: "list"
            fields:
              - { name: "year", label: "Year", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "detail", label: "Detail / Journal", widget: "string" }
              - { name: "tag", label: "Category Tag", widget: "string" }

  - name: "memberships"
    label: "Memberships"
    files:
      - name: "memberships"
        label: "Memberships List"
        file: "content/memberships.json"
        fields:
          - name: "memberships"
            label: "Organizations"
            widget: "list"
            fields:
              - { name: "name", label: "Organization Name", widget: "string" }

  - name: "gallery"
    label: "Photo Gallery"
    files:
      - name: "gallery"
        label: "Gallery Images"
        file: "content/gallery.json"
        fields:
          - name: "gallery"
            label: "Photos"
            widget: "list"
            fields:
              - { name: "image", label: "Photo", widget: "image" }
              - { name: "caption", label: "Caption / Alt Text", widget: "string", required: false }

  - name: "videos"
    label: "Video Gallery"
    files:
      - name: "videos"
        label: "Videos List"
        file: "content/videos.json"
        fields:
          - name: "videos"
            label: "Videos"
            widget: "list"
            fields:
              - { name: "title", label: "Title", widget: "string" }
              - { name: "category", label: "Category / Description", widget: "string" }
              - { name: "video_url", label: "Video Link (YouTube etc.)", widget: "string", required: false }

  - name: "testimonials"
    label: "Testimonials"
    files:
      - name: "testimonials"
        label: "Testimonials List"
        file: "content/testimonials.json"
        fields:
          - name: "testimonials"
            label: "Testimonials"
            widget: "list"
            fields:
              - { name: "quote", label: "Quote", widget: "text" }
              - { name: "name", label: "Patient / Parent Label", widget: "string" }
              - { name: "relation", label: "Procedure / Relation", widget: "string" }
              - { name: "rating", label: "Star Rating (1-5)", widget: "number", default: 5, min: 1, max: 5 }

  - name: "chambers"
    label: "Chambers"
    files:
      - name: "chambers"
        label: "Chambers List"
        file: "content/chambers.json"
        fields:
          - name: "chambers"
            label: "Chambers"
            widget: "list"
            fields:
              - { name: "tag", label: "Chamber Type Tag", widget: "string" }
              - { name: "name", label: "Chamber Name", widget: "string" }
              - { name: "address", label: "Address", widget: "text" }
              - { name: "days", label: "Days", widget: "string" }
              - { name: "hours", label: "Hours", widget: "string" }
              - { name: "phone", label: "Phone", widget: "string" }

  - name: "contact"
    label: "Contact Info"
    files:
      - name: "contact"
        label: "Contact Details"
        file: "content/contact.json"
        fields:
          - { name: "phone", label: "Phone", widget: "string" }
          - { name: "email", label: "Email", widget: "string" }
          - { name: "address", label: "Main Address", widget: "text" }
          - { name: "hours", label: "Hours", widget: "string" }
          - { name: "map_embed_url", label: "Google Maps Embed URL", widget: "string" }
